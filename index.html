<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英検準2級 Writing">
<meta name="theme-color" content="#07111f">
<link rel="apple-touch-icon" href="icon-180.png">
<title>英検準2級 Writing Trainer</title>
<style>
:root{
  --bg:#07111f;--panel:#101d30;--panel2:#182a43;--line:#29425f;--text:#f8fafc;--muted:#9fb0c5;
  --cyan:#38bdf8;--purple:#7c3aed;--green:#22c55e;--yellow:#facc15;--red:#f87171;
  --rail:172px;--dock:58px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;touch-action:manipulation}
.screen{display:none;width:100%;height:100dvh}
.screen.active{display:block}

/* HOME */
#home{padding:22px}
.homeGrid{height:100%;display:grid;place-items:center}
.homeCard{width:min(900px,94vw);display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.panel{background:linear-gradient(180deg,var(--panel),#0c1727);border:1px solid var(--line);border-radius:22px;padding:20px}
h1{margin:0 0 8px;font-size:clamp(28px,4vw,46px)}
.muted{color:var(--muted)}
.homeBtns{display:grid;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}
.primary{background:var(--cyan);color:#062236}
.secondary{background:#20344f;color:#fff}
.ghost{background:transparent;border:1px solid var(--line);color:#fff}

/* OPINION — hard fixed landscape layout, no center scroll */
#opinion{position:relative;overflow:hidden;padding:8px calc(var(--rail) + 16px) 8px 10px}
.main{
  height:100%;
  min-width:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) var(--dock);
  gap:7px;
}
.questionCard{
  min-width:0;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:7px 12px;
}
.qRow{display:flex;align-items:baseline;gap:12px;min-width:0}
.qLabel{flex:0 0 auto;color:var(--muted);font-size:12px}
#question{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:900;font-size:clamp(15px,1.8vw,22px)}
#questionJp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:10px;margin-top:3px}

/* Center work stage */
.work{
  position:relative;min-height:0;overflow:hidden;
  display:grid;align-content:center;gap:9px;
}
#controls{
  min-height:0;width:100%;height:100%;
  display:grid;align-content:center;gap:9px;
  overflow:hidden;
}
.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.choiceGrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choiceGrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.choice{
  min-width:0;border:2px solid transparent;border-radius:16px;background:#1a2d47;color:#fff;
  padding:10px 12px;text-align:left;font-weight:850;cursor:pointer;
  min-height:58px;max-height:78px;overflow:hidden;
}
.choice.center{text-align:center}
.choice.good{border-color:var(--green);background:#0f2b1b}
.choice.bad{border-color:var(--red)}
.choice .jp{display:block;color:#b9c7d8;font-size:10px;margin-top:4px;line-height:1.15}
.fixedButton{
  width:100%;min-height:58px;max-height:72px;border-radius:16px;border:2px solid #8b8df8;
  background:#37358d;color:#fff;font-weight:950;font-size:clamp(17px,2vw,23px);cursor:pointer;
}
.fixedButton small{display:block;font-size:10px;color:#ddd6fe;margin-top:3px}
.sentenceBuilder{
  border:1px solid var(--line);border-radius:16px;background:#0c1829;padding:10px 13px;
  font-size:clamp(18px,2.1vw,26px);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.blue{color:var(--cyan)} .yellow{color:var(--yellow)} .red{color:var(--red)} .purple{color:#8b5cf6}
.strike{text-decoration:line-through;text-decoration-thickness:3px}
.arrow{text-align:center;color:var(--muted);font-size:20px;line-height:1}
.transform{
  display:grid;gap:5px;border:1px solid var(--line);border-radius:16px;background:#0c1829;padding:10px 13px;
  font-size:clamp(16px,1.9vw,22px);font-weight:800;line-height:1.25;
}
.centerWrap{display:grid;gap:9px;align-content:center}
.statusBox{border:1px solid var(--line);border-radius:16px;padding:12px;background:#0c1829;text-align:center;font-weight:900}

/* transient instruction; overlays only upper edge of work */
#guide{
  position:absolute;left:7%;right:7%;top:4px;z-index:20;
  background:rgba(240,249,255,.97);color:#12304a;border:2px solid var(--cyan);border-radius:13px;
  padding:8px 46px;text-align:center;font-size:12px;font-weight:850;line-height:1.25;
  opacity:0;pointer-events:auto;
}
#guide::before{content:"🔊";position:absolute;left:13px;top:50%;transform:translateY(-50%)}
#guide::after{content:"×";position:absolute;right:14px;top:50%;transform:translateY(-54%);font-size:18px}
#guide.show{animation:guideFade 2.65s ease forwards}
@keyframes guideFade{0%{opacity:0;transform:translateY(-4px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-3px)}}

/* compact dock */
.dock{
  background:#fff;color:#0f172a;border-top:4px solid var(--cyan);
  padding:4px 10px 5px;overflow:hidden;
}
.dockTop{display:flex;justify-content:space-between;gap:8px;color:#64748b;font-size:9px;font-weight:900;line-height:1}
#dockSentence{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(15px,1.8vw,20px);font-weight:950;line-height:1.25;margin-top:3px}
#dockTranslation{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#64748b;font-size:9px;margin-top:1px}
.ghostText{opacity:.23;color:#64748b!important}
@keyframes ink{0%{opacity:.2;transform:scale(.985)}50%{opacity:1;transform:scale(1.015)}100%{opacity:1;transform:scale(1)}}
.ink{animation:ink .42s ease}

/* right rail */
.rail{
  position:absolute;top:8px;right:8px;bottom:8px;width:var(--rail);
  background:rgba(8,17,31,.98);border:1px solid var(--line);border-radius:19px;padding:8px;
  display:flex;flex-direction:column;gap:7px;overflow:hidden;
}
.brand{text-align:center;font-size:12px;font-weight:950}
#stepTitle{text-align:center;color:var(--cyan);font-size:14px;font-weight:950;line-height:1.15}
.track{height:6px;background:#233852;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--cyan)}
.langBox{margin-top:auto;display:grid;gap:4px;border:1px solid var(--line);border-radius:13px;padding:4px}
.langBtn{border:0;border-radius:10px;background:transparent;color:#aebdd0;padding:7px 3px;font-size:11px;font-weight:850}
.langBtn.active{background:#29415f;color:#fff}
.railBtn{border:1px solid var(--line);border-radius:11px;background:transparent;color:#fff;font-weight:900;padding:8px 4px;cursor:pointer}

/* Step 9: seven items all visible */
.sequenceGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seq{border:1px solid var(--line);border-radius:14px;background:#182a43;color:#fff;padding:9px 7px;min-height:50px;font-size:12px;font-weight:900;cursor:pointer;text-align:center}
.seq.used{opacity:0;visibility:hidden;pointer-events:none}
.sequenceMade{display:flex;gap:5px;flex-wrap:wrap;min-height:24px;justify-content:center}
.token{background:#0f2e23;border:1px solid #1d7a50;border-radius:9px;padding:4px 7px;font-size:10px}

/* toast + completion flash */
.toast{position:fixed;left:42%;bottom:72px;transform:translateX(-50%);z-index:80;background:#07111f;border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-size:12px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.flash{
  position:fixed;left:42%;top:52%;transform:translate(-50%,-50%);z-index:70;
  background:#07111f;border:2px solid var(--cyan);border-radius:17px;padding:12px 18px;
  max-width:65vw;font-size:clamp(18px,2.2vw,26px);font-weight:950;opacity:0;pointer-events:none;
}
.flash.show{animation:flashMove .62s ease forwards}
@keyframes flashMove{0%{opacity:0;transform:translate(-50%,-46%) scale(.97)}25%,65%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-56%) scale(.94)}}

/* email minimal */
#email{padding:16px}.emailBox{max-width:900px;margin:auto}.emailText{line-height:1.55}
.rotate{display:none}
@media(orientation:portrait) and (max-width:900px){
  .rotate{display:flex;position:fixed;inset:0;z-index:999;background:#07111f;align-items:center;justify-content:center;text-align:center;padding:24px}
}
@media(max-width:850px){
  :root{--rail:142px;--dock:52px}
  #opinion{padding-right:calc(var(--rail) + 12px);padding-left:7px}
  .rail{top:5px;right:5px;bottom:5px;padding:5px}
  .brand{font-size:10px}.langBtn{padding:5px 2px;font-size:9px}.railBtn{padding:6px 3px;font-size:10px}
  #stepTitle{font-size:11px}
  .questionCard{padding:5px 9px}
  #question{font-size:13px}#questionJp{font-size:9px}
  .choice{min-height:46px;max-height:62px;padding:7px 8px;font-size:12px}
  .choice .jp{font-size:8px}
  .fixedButton{min-height:46px;max-height:54px;font-size:15px}
  .sentenceBuilder,.transform{font-size:14px;padding:7px 9px}
  #guide{left:4%;right:4%;font-size:10px;padding:6px 38px}
  .sequenceGrid{gap:5px}.seq{min-height:40px;padding:6px 4px;font-size:10px}
}

/* ===== RESULT / PRINT ===== */
.resultScreen{background:#07111f;padding:14px;overflow:auto}
.resultWrap{width:min(1180px,96vw);min-height:calc(100dvh - 28px);margin:auto;background:#fff;color:#0f172a;border-radius:20px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.resultHead{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:4px solid #38bdf8;padding-bottom:10px}
.resultHead h2{font-size:30px;margin:2px 0 0}.resultKicker{font-size:12px;font-weight:900;color:#0284c7;letter-spacing:.08em}.resultWords{font-size:18px;font-weight:950;color:#0f766e}
.resultQuestionBox{background:#f1f5f9;border-radius:14px;padding:12px 16px}.resultLabel{font-size:10px;font-weight:900;color:#64748b}.resultQuestion{font-size:20px;font-weight:950;line-height:1.35}.resultJp{font-size:13px;color:#64748b;margin-top:4px}
.resultAnswer{display:grid;gap:8px;flex:1;align-content:start}.resultLine{border-left:5px solid #38bdf8;background:#f8fafc;border-radius:8px;padding:8px 12px}.resultEn{font-size:20px;font-weight:900;line-height:1.3}.resultLine .resultJp{font-size:13px;color:#475569}.resultActions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;border-top:1px solid #cbd5e1;padding-top:10px}
@media(max-width:850px){.resultScreen{padding:6px}.resultWrap{width:100%;min-height:calc(100dvh - 12px);padding:10px 14px;gap:7px;border-radius:12px}.resultHead h2{font-size:20px}.resultWords{font-size:13px}.resultQuestionBox{padding:7px 10px}.resultQuestion{font-size:14px}.resultJp{font-size:9px}.resultAnswer{gap:4px}.resultLine{padding:5px 8px}.resultEn{font-size:13px}.resultLine .resultJp{font-size:9px}.resultActions{padding-top:6px}.resultActions .btn{padding:7px 10px;font-size:11px}}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff!important;overflow:visible!important}
  body>*{display:none!important}
  #result{display:block!important;position:static!important;width:auto!important;height:auto!important;padding:0!important;background:#fff!important}
  #result .resultWrap{display:block!important;width:auto!important;min-height:0!important;margin:0!important;padding:0!important;border-radius:0!important}
  #result .resultActions{display:none!important}
  #result .resultHead{margin-bottom:10mm}
  #result .resultQuestionBox{margin-bottom:8mm}
  #result .resultAnswer{display:block!important}
  #result .resultLine{break-inside:avoid;margin-bottom:4mm;background:#fff!important;border:1px solid #cbd5e1!important;border-left:5px solid #38bdf8!important}
  #result .resultEn{font-size:16pt!important}
  #result .resultJp{font-size:10pt!important;color:#475569!important}
}


/* ===== v5: STEP1 single-line stabilization ===== */
.transform{
  display:grid;
  grid-template-columns:1fr !important;
  gap:5px;
}
.transform > div:not(.arrow){
  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:clip !important;
  width:100%;
  max-width:100%;
  line-height:1.2 !important;
  font-size:clamp(12px,1.45vw,18px) !important;
}
.transform .arrow{
  white-space:nowrap !important;
}

/* Avoid Safari's first-landscape stale text sizing */
#controls,.transform,.transform > div{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}


/* ===== v7: lower dock restored; never reveal variable answer before selection ===== */
#opinion .main{grid-template-rows:auto minmax(0,1fr) var(--dock)!important;}
#opinion .dock{display:block!important;min-height:50px!important;max-height:58px!important;overflow:hidden!important;}

/* ===== v6: result screen = one viewport, no scroll ===== */
.resultScreen{background:#07111f!important;padding:8px!important;overflow:hidden!important;}
.resultWrap{
  width:100%!important;height:calc(100dvh - 16px)!important;min-height:0!important;
  margin:0!important;border-radius:16px!important;padding:10px 14px!important;
  display:grid!important;grid-template-rows:auto auto minmax(0,1fr) auto!important;
  gap:7px!important;overflow:hidden!important;
}
.resultHead{padding-bottom:6px!important;border-bottom-width:3px!important;}
.resultHead h2{font-size:clamp(20px,2.7vw,30px)!important;margin:0!important;}
.resultKicker{font-size:9px!important;}.resultWords{font-size:clamp(13px,2vw,18px)!important;}
.resultQuestionBox{padding:7px 10px!important;border-radius:10px!important;overflow:hidden!important;}
.resultQuestion{font-size:clamp(13px,1.8vw,19px)!important;line-height:1.15!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}
.resultQuestionBox .resultJp{font-size:9px!important;line-height:1.15!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;margin-top:2px!important;}
.resultAnswer{
  display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;
  grid-auto-rows:minmax(0,1fr)!important;gap:6px!important;min-height:0!important;overflow:hidden!important;
}
.resultLine{min-width:0!important;min-height:0!important;border-left-width:4px!important;border-radius:8px!important;padding:6px 8px!important;overflow:hidden!important;}
.resultEn{font-size:clamp(11px,1.35vw,16px)!important;line-height:1.12!important;}
.resultLine .resultJp{font-size:clamp(8px,.95vw,11px)!important;line-height:1.12!important;margin-top:3px!important;}
.resultActions{padding-top:5px!important;gap:6px!important;flex-wrap:nowrap!important;}
.resultActions .btn{padding:7px 10px!important;font-size:11px!important;}

@media(max-width:850px){
  .resultScreen{padding:4px!important;}
  .resultWrap{height:calc(100dvh - 8px)!important;padding:6px 8px!important;gap:4px!important;border-radius:10px!important;}
  .resultHead{padding-bottom:3px!important;}
  .resultHead h2{font-size:17px!important;}.resultKicker{font-size:7px!important}.resultWords{font-size:11px!important}
  .resultQuestionBox{padding:4px 7px!important;}
  .resultQuestion{font-size:11px!important}.resultQuestionBox .resultJp{font-size:7px!important}
  .resultAnswer{gap:4px!important;}
  .resultLine{padding:4px 5px!important;border-left-width:3px!important;}
  .resultEn{font-size:9.3px!important}.resultLine .resultJp{font-size:6.9px!important;margin-top:2px!important}
  .resultActions{padding-top:3px!important;gap:4px!important}.resultActions .btn{padding:5px 7px!important;font-size:8px!important}
}

/* ===== A4 landscape, exactly one page ===== */
@media print{
  @page{size:A4 landscape;margin:7mm}
  html,body{width:100%!important;height:auto!important;background:#fff!important;overflow:visible!important;}
  body>*{display:none!important}
  #result{display:block!important;position:static!important;width:100%!important;height:auto!important;padding:0!important;background:#fff!important;overflow:visible!important}
  #result .resultWrap{
    display:grid!important;width:100%!important;height:190mm!important;min-height:0!important;
    margin:0!important;padding:0!important;border-radius:0!important;overflow:hidden!important;
    grid-template-rows:14mm 25mm minmax(0,1fr)!important;gap:4mm!important;
  }
  #result .resultHead{margin:0!important;padding:0 0 2mm!important;border-bottom:1.2mm solid #38bdf8!important;}
  #result .resultHead h2{font-size:18pt!important}
  #result .resultKicker{font-size:8pt!important}
  #result .resultWords{font-size:13pt!important}
  #result .resultQuestionBox{margin:0!important;padding:3mm 4mm!important;border-radius:3mm!important;}
  #result .resultQuestion{font-size:13pt!important;line-height:1.15!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
  #result .resultQuestionBox .resultJp{font-size:8.5pt!important;line-height:1.15!important}
  #result .resultAnswer{
    display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;
    grid-template-rows:repeat(4,minmax(0,1fr))!important;gap:2.5mm!important;overflow:hidden!important;
  }
  #result .resultLine{margin:0!important;padding:2.3mm 3mm!important;border:0.35mm solid #cbd5e1!important;border-left:1.4mm solid #38bdf8!important;border-radius:2mm!important;background:#fff!important;break-inside:avoid!important;overflow:hidden!important;}
  #result .resultEn{font-size:11pt!important;line-height:1.13!important}
  #result .resultJp{font-size:7.8pt!important;line-height:1.13!important;color:#475569!important;margin-top:1mm!important}
  #result .resultActions{display:none!important}
}

</style>
</head>
<body>
<div class="rotate"><div><div style="font-size:42px">↻</div><h2>iPhoneを横向きにしてください</h2></div></div>
<div id="toast" class="toast"></div>
<div id="flash" class="flash"></div>

<section id="home" class="screen active">
  <div class="homeGrid"><div class="homeCard">
    <div class="panel">
      <div class="muted" style="font-size:12px">EIKEN PRE-2</div>
      <h1>Writing Trainer</h1>
      <p class="muted">定型文は押して覚える。問題に合わせる部分だけを選ぶ。最後に型を再現します。</p>
    </div>
    <div class="panel homeBtns">
      <button id="startOpinion" class="btn primary">✍️ 意見論述 9STEP</button>
      <button id="resumeOpinion" class="btn secondary">▶ 続きから</button>
      <button id="startEmail" class="btn secondary">✉️ Eメール</button>
      <button id="resetBtn" class="btn ghost">↺ 論述を最初から</button>
    </div>
  </div></div>
</section>

<section id="opinion" class="screen">
  <main class="main">
    <section class="questionCard">
      <div class="qRow"><span class="qLabel">QUESTION</span><div id="question"></div></div>
      <div id="questionJp"></div>
    </section>

    <section class="work">
      <div id="guide"></div>
      <div id="controls"></div>
    </section>

    <section class="dock">
      <div class="dockTop"><span id="dockLabel">このSTEPの文</span><span id="dockCount"></span></div>
      <div id="dockSentence"></div>
      <div id="dockTranslation"></div>
    </section>
  </main>

  <aside class="rail">
    <div class="brand">✍️ 意見論述 TRAINER</div>
    <div id="stepTitle"></div>
    <div class="track"><div id="stepFill" class="fill"></div></div>
    <div class="langBox">
      <button class="langBtn" data-lang="show">訳あり</button>
      <button class="langBtn" data-lang="hide">訳なし</button>
    </div>
    <button id="helpBtn" class="railBtn">？</button>
    <button id="homeBtn" class="railBtn">ホーム</button>
  </aside>
</section>

<section id="result" class="screen resultScreen">
  <div class="resultWrap">
    <div class="resultHead">
      <div>
        <div class="resultKicker">1問完成・全文確認</div>
        <h2>完成答案</h2>
      </div>
      <div id="resultWordCount" class="resultWords"></div>
    </div>
    <div class="resultQuestionBox">
      <div class="resultLabel">QUESTION</div>
      <div id="resultQuestion" class="resultQuestion"></div>
      <div id="resultQuestionJp" class="resultJp"></div>
    </div>
    <div id="resultAnswer" class="resultAnswer"></div>
    <div class="resultActions">
      <button id="printResult" class="btn primary">🖨️ プリント</button>
      <button id="nextResult" class="btn primary">次の問題 ▶</button>
      <button id="retryResult" class="btn secondary">この問題をもう一度</button>
      <button id="resultHome" class="btn ghost">ホーム</button>
    </div>
  </div>
</section>

<section id="email" class="screen">
  <div class="emailBox panel">
    <h2>✉️ Eメール</h2>
    <p class="emailText">Eメールコースは現在の簡易版を保持しています。論述レイアウトを固めたあと、同じ考え方でSTEP化できます。</p>
    <button id="emailHome" class="btn secondary">ホーム</button>
  </div>
</section>

<script>
const KEY="eikenP2Writing_clean_v1";
const QUESTIONS=[
{
 id:"morning",type:"doThink",
 q:"Do you think students should study before school in the morning?",
 jp:"生徒は朝、学校へ行く前に勉強するべきだと思いますか？",
 statement:"students should study before school in the morning",

const defaultState=()=>({
 qIndex:0,step:1,lang:"show",lines:[],stage:null,selected1:null,selected2:null,
 step1Correct:false,fixedTapped:false,sequence:[],history:[],streak:0
});
let state;
try{state=Object.assign(defaultState(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){state=defaultState()}
if(state.lang==="tap") state.lang="show";
const debugStep=Number(new URLSearchParams(location.search).get("testStep")||0);
if(debugStep){
 state=defaultState(); state.step=debugStep;
 state.lines=[
  {text:"I think that students should study before school in the morning.",role:"opening"},
  {text:"I have two reasons.",role:"fixed"},
  {text:"First, they can use their time well.",role:"reason"},
  {text:"For example, they can finish some homework early.",role:"example"},
  {text:"Second, they can concentrate better.",role:"reason"}
 ];
 state.selected1=1;state.selected2=2;state.step1Correct=true;
 if([3,5].includes(debugStep))state.stage="phrase";
 if([4,6].includes(debugStep))state.stage="detail";
}
const $=id=>document.getElementById(id);
const q=()=>QUESTIONS[state.qIndex%QUESTIONS.length];
const words=s=>(s.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]).length;
const allText=()=>state.lines.map(x=>x.text).join(" ");
function save(){if(!debugStep)localStorage.setItem(KEY,JSON.stringify(state))}
function showScreen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),950)}
function flash(t){$("flash").textContent=t;$("flash").classList.remove("show");void $("flash").offsetWidth;$("flash").classList.add("show")}
function opening(x){return x.type==="doThink" ? `I think that ${x.statement}.` : `I think that ${x.subject} should ${x.predicate}.`}

function fitTransformLines(){
  document.querySelectorAll(".transform > div:not(.arrow)").forEach(el=>{
    el.style.fontSize="";
    let size=parseFloat(getComputedStyle(el).fontSize)||18;
    const min=10.5;
    let guard=0;
    while(el.scrollWidth>el.clientWidth+1 && size>min && guard<30){
      size-=0.5;
      el.style.fontSize=size+"px";
      guard++;
    }
  });
}
function scheduleFitTransform(){
  requestAnimationFrame(()=>requestAnimationFrame(fitTransformLines));
  setTimeout(fitTransformLines,80);
  setTimeout(fitTransformLines,220);
}
window.addEventListener("resize",scheduleFitTransform);
window.addEventListener("orientationchange",()=>{
  setTimeout(scheduleFitTransform,120);
  setTimeout(scheduleFitTransform,420);
});

function jpHTML(jp){
 if(state.lang==="hide")return "";
 return jp ? `<span class="jp">${jp}</span>` : "";
}
function choice(text,jp,onClick,cls=""){
 const b=document.createElement("button");b.className=`choice ${cls}`;b.innerHTML=`${text}${jpHTML(jp)}`;
 b.onclick=onClick;
 return b;
}
function addLine(text,role){state.lines.push({text,role});save()}
function setStep(n){state.step=n;state.stage=null;state.fixedTapped=false;save();render()}
function setDock(label,html,jp="",ghost=false){
 $("dockLabel").textContent=label;$("dockSentence").innerHTML=html;$("dockTranslation").textContent=state.lang==="hide"?"":jp;
 $("dockSentence").classList.toggle("ghostText",ghost);
}
let lastGuide="",guideTimer=null,preferredVoice=null;
function naturalText(t){return t.replace(/<[^>]+>/g,"").replace(/QUESTION/g,"クエスチョン").replace(/First/g,"ファースト").replace(/Second/g,"セカンド").replace(/For example/g,"フォー・イグザンプル")}
function pickVoice(){
 if(!("speechSynthesis" in window))return null;
 const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
 const keys=["Siri","Kyoko","Otoya","Nanami","Premium","Enhanced"];
 for(const k of keys){const v=vs.find(x=>(x.name||"").includes(k));if(v)return v}
 return vs[0]||null;
}
function speak(t){
 try{
   if(new URLSearchParams(location.search).has("noVoice")) return;
   if(!("speechSynthesis" in window))return;
   speechSynthesis.cancel();preferredVoice=preferredVoice||pickVoice();
   const u=new SpeechSynthesisUtterance(naturalText(t));u.lang="ja-JP";u.rate=.94;u.pitch=1.02;if(preferredVoice)u.voice=preferredVoice;
   speechSynthesis.speak(u);
 }catch(e){}
}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>preferredVoice=pickVoice();
function guide(t){
 lastGuide=t;$("guide").innerHTML=t;$("guide").classList.remove("show");void $("guide").offsetWidth;$("guide").classList.add("show");
 speak(t);clearTimeout(guideTimer);guideTimer=setTimeout(()=>$("guide").classList.remove("show"),2700)
}
$("guide").onclick=e=>{
 const r=$("guide").getBoundingClientRect();
 if(e.clientX>r.right-46){$("guide").classList.remove("show");try{speechSynthesis.cancel()}catch(_){}}
 else speak(lastGuide);
};

const TITLES=["","QUESTION → 書き出し","理由を始める","理由①を作る","理由①を詳しく","理由②を作る","理由②を詳しく","最後の定型文","50〜60語を確認","見ないで型を再現"];
function render(){
 const x=q();
 $("question").textContent=x.q;
 $("questionJp").textContent=state.lang==="hide"?"":x.jp;
 $("stepTitle").innerHTML=`STEP ${state.step} / 9<br>${TITLES[state.step]}`;
 $("stepFill").style.width=`${state.step/9*100}%`;
 document.querySelectorAll(".langBtn").forEach(b=>b.classList.toggle("active",b.dataset.lang===state.lang));
 $("controls").innerHTML="";
 if(state.step===1)step1(x);
 if(state.step===2)fixedStep("I have two reasons.","理由は2つあります。","fixed",3,"理由を始める定型文を押してください。");
 if(state.step===3)reasonStep(1);
 if(state.step===4)detailStep(1);
 if(state.step===5)reasonStep(2);
 if(state.step===6)detailStep(2);
 if(state.step===7)fixedStep("For these reasons, I think so.","これらの理由から、私はそう思います。","close",8,"最後の定型文を押してください。");
 if(state.step===8)wordStep();
 if(state.step===9)sequenceStep();
 scheduleFitTransform();
}
function confirmDock(){
 $("dockSentence").classList.remove("ghostText");$("dockSentence").classList.remove("ink");void $("dockSentence").offsetWidth;$("dockSentence").classList.add("ink");
}
function step1(x){
 if(!state.step1Correct){
   setDock("STEP 1｜書き出し",`<span class="blue">I think that</span> QUESTIONの後半.`,"QUESTIONの形を見抜こう",true);
   guide("QUESTIONの形を選んでください。");
   const g=document.createElement("div");g.className="choiceGrid";
   const a=choice("Do you think ～ ?","",()=>checkType("doThink",a),"center");
   const b=choice("Should ～ ?","",()=>checkType("should",b),"center");
   g.append(a,b);$("controls").append(g);return;
 }
 const box=document.createElement("div");box.className="centerWrap";
 const t=document.createElement("div");t.className="transform";
 if(x.type==="doThink"){
  t.innerHTML=`<div><span class="red strike">Do you think</span> <span class="yellow">${x.statement}</span> ?</div><div class="arrow">↓</div><div><span class="blue">I think that</span> <span class="yellow">${x.statement}</span>.</div>`;
 }else{
  t.innerHTML=`<div><span class="red strike">Should</span> <span class="yellow">${x.subject}</span> ${x.predicate}?</div><div class="arrow">↓ Should を主語の後ろへ</div><div><span class="blue">I think that</span> ${x.subject} <span class="blue">should</span> ${x.predicate}.</div>`;
 }
 setDock("STEP 1｜書き出し",`I think that ______.`,"ボタンを押すまでは完成文を表示しません",true);
 const btn=document.createElement("button");btn.className="fixedButton";btn.innerHTML=`この書き出しを答案に入れる<small>${opening(x)}</small>`;
 btn.onclick=()=>{
   state.fixedTapped=true;
   setDock("STEP 1｜書き出し",opening(x),"書き出しを答案に入れました",false);
   confirmDock();
   flash(opening(x));
   setTimeout(()=>{if(!state.lines.length)addLine(opening(x),"opening");setStep(2)},520)
 };
 box.append(t,btn);$("controls").append(box);guide("変わった部分を確認して、書き出しを答案に入れてください。");
}
function checkType(type,btn){
 if(type===q().type){btn.classList.add("good");state.step1Correct=true;save();setTimeout(render,180)}
 else{btn.classList.add("bad");toast("もう一度！");setTimeout(()=>btn.classList.remove("bad"),450)}
}
function fixedStep(en,jp,role,next,msg){
 setDock(`STEP ${state.step}｜${TITLES[state.step]}`,en,jp,!state.fixedTapped);
 guide(msg);
 const b=document.createElement("button");b.className="fixedButton";b.innerHTML=`${en}<small>${state.lang==="hide"?"":jp}</small>`;
 b.onclick=()=>{state.fixedTapped=true;confirmDock();flash(en);setTimeout(()=>{addLine(en,role);setStep(next)},500)};
 $("controls").append(b);
}
function reasonStep(which){
 const x=q(),first=which===1,idx=first?state.selected1:state.selected2;
 const lead=first?"First,":"Second,";
 const fixedChunk=`${lead} they can`;
 if(!state.stage){
   setDock(`STEP ${state.step}｜理由${first?"①":"②"}`,`${fixedChunk} ______.`,first?"「第一に、彼らは〜できる」までを定型で覚える":"「第二に、彼らは〜できる」までを定型で覚える",true);
   guide(`${first?"1つ目":"2つ目"}の理由は、「${fixedChunk}」までを定型文として押してください。`);
   const b=document.createElement("button");b.className="fixedButton";b.innerHTML=`${fixedChunk}<small>${first?"第一に、彼らは〜できる":"第二に、彼らは〜できる"}</small>`;
   b.onclick=()=>{state.fixedTapped=true;confirmDock();setTimeout(()=>{state.stage="category";save();render()},260)};
   $("controls").append(b);return;
 }
 if(state.stage==="category"){
   setDock(`STEP ${state.step}｜理由${first?"①":"②"}`,`${fixedChunk} ______.`,"QUESTIONに合う理由の中身を選ぶ",false);
   guide("QUESTIONに合う理由の方向を選んでください。");
   const g=document.createElement("div");g.className="choiceGrid three";
   x.reasons.forEach((r,i)=>{
     if(!first&&i===state.selected1)return;
     g.append(choice(r.cat,r.jp,()=>{if(first)state.selected1=i;else state.selected2=i;state.stage="phrase";save();render()}));
   });
   $("controls").append(g);return;
 }
 const r=x.reasons[idx];
 setDock(`STEP ${state.step}｜理由${first?"①":"②"}`,`${fixedChunk} ______.`,"カードを選ぶまでは答え部分を表示しません",false);
 guide("「they can」の後ろに入る、理由の中身を選んでください。");
 const build=document.createElement("div");build.className="sentenceBuilder";build.innerHTML=`<span class="blue">${fixedChunk}</span> <span class="yellow">______</span>.`;
 const g=document.createElement("div");g.className="choiceGrid three";
 const opts=[
   {en:r.en.replace(/^they can /,""),jp:r.jp,ok:true},
   {en:x.wrong[0],jp:"この問題には合いにくい",ok:false},
   {en:x.wrong[1],jp:"この問題には合いにくい",ok:false}
 ];
 opts.forEach(o=>g.append(choice(o.en,o.jp,()=>{
   if(!o.ok){toast("QUESTIONに合うものを選ぼう");return}
   const s=`${lead.replace(",","")}, ${r.en}.`;
   setDock(`STEP ${state.step}｜理由${first?"①":"②"}`,s,"選んだカードで文が完成しました",false);
   confirmDock();
   flash(s);
   setTimeout(()=>{addLine(s,"reason");state.stage=null;save();setStep(first?4:6)},520)
 })));
 $("controls").append(build,g);
}
function detailStep(which){
 const x=q(),idx=which===1?state.selected1:state.selected2,r=x.reasons[idx];
 if(!state.stage){
   setDock(`STEP ${state.step}｜理由${which===1?"①":"②"}を詳しく`,"For example, they can ______.","「例えば、彼らは〜できる」までを定型で覚える",true);
   guide("具体例は、「For example, they can」までを定型文として押してください。");
   const b=document.createElement("button");b.className="fixedButton";b.innerHTML=`For example, they can<small>例えば、彼らは〜できる</small>`;
   b.onclick=()=>{state.fixedTapped=true;confirmDock();setTimeout(()=>{state.stage="detail";save();render()},260)};
   $("controls").append(b);return;
 }
 setDock(`STEP ${state.step}｜具体化`,"For example, they can ______.","カードを選ぶまでは答え部分を表示しません",false);
 guide("「they can」の後ろに入る、前の理由につながる具体的な内容を選んでください。");
 const build=document.createElement("div");build.className="sentenceBuilder";build.innerHTML=`<span class="blue">For example, they can</span> <span class="yellow">______</span>.`;
 const other=x.reasons[(idx+1)%x.reasons.length].detail.replace(/^they can /,"");
 const opts=[
  {en:r.detail.replace(/^they can /,""),jp:r.detailJp,ok:true},
  {en:other,jp:"理由と少しずれる",ok:false},
  {en:x.wrong[0],jp:"この問題には合いにくい",ok:false}
 ];
 const g=document.createElement("div");g.className="choiceGrid three";
 opts.forEach(o=>g.append(choice(o.en,o.jp,()=>{
   if(!o.ok){toast("前の理由とつながるものを選ぼう");return}
   const s=`For example, ${r.detail}.`;
   setDock(`STEP ${state.step}｜具体化`,s,"選んだカードで文が完成しました",false);
   confirmDock();
   flash(s);
   setTimeout(()=>{addLine(s,"example");state.stage=null;save();setStep(which===1?5:7)},520)
 })));
 $("controls").append(build,g);
}
function wordStep(){
 const n=words(allText());$("dockCount").textContent=`${n} / 50–60 words`;
 if(n>=50&&n<=60){
   setDock("STEP 8｜語数確認",`🎯 ${n} WORDS — OK!`,"50〜60語に入っています。",false);
   guide("語数は合格範囲です。最後に型を確認しましょう。");
   const b=document.createElement("button");b.className="fixedButton";b.textContent="型の最終チェックへ ▶";b.onclick=()=>setStep(9);$("controls").append(b);return;
 }
 if(n<50){
   setDock("STEP 8｜語数確認",`${n} WORDS`,"不足した時だけ自然な言葉を足す",false);
   guide(`あと${50-n}語以上です。自然に足せる言葉を選んでください。`);
   const g=document.createElement("div");g.className="choiceGrid";
   q().boosters.forEach(t=>g.append(choice(`+ ${t}`,"",()=>{const i=Math.max(0,state.lines.length-2);state.lines[i].text=state.lines[i].text.replace(/\.$/,"")+" "+t+".";save();render()},"center")));
   $("controls").append(g);return;
 }
 setDock("STEP 8｜語数確認",`${n} WORDS`,"60語を超えています。",false);
 const b=document.createElement("button");b.className="fixedButton";b.textContent="この問題をやり直す";b.onclick=resetCurrent;$("controls").append(b);
}
function resultTranslations(){
 const x=q();
 const r1=x.reasons[state.selected1]||null;
 const r2=x.reasons[state.selected2]||null;
 const rows=[];
 rows.push({en:opening(x),jp:x.openingJp||"私は、そう思います。"});
 rows.push({en:"I have two reasons.",jp:"理由は2つあります。"});
 if(r1){
   rows.push({en:state.lines.find(v=>v.role==="reason")?.text||`First, ${r1.en}.`,jp:`第一に、${r1.jp}。`});
   rows.push({en:state.lines.find(v=>v.role==="example")?.text||`For example, ${r1.detail}.`,jp:`例えば、${r1.detailJp}。`});
 }
 if(r2){
   const reasons=state.lines.filter(v=>v.role==="reason");
   const examples=state.lines.filter(v=>v.role==="example");
   rows.push({en:reasons[1]?.text||`Second, ${r2.en}.`,jp:`第二に、${r2.jp}。`});
   rows.push({en:examples[1]?.text||`For example, ${r2.detail}.`,jp:`例えば、${r2.detailJp}。`});
 }
 rows.push({en:"For these reasons, I think so.",jp:"これらの理由から、私はそう思います。"});
 return rows;
}
function showResult(){
 const x=q();
 $("resultQuestion").textContent=x.q;
 $("resultQuestionJp").textContent=x.jp;
 $("resultWordCount").textContent=`${words(allText())} words`;
 const wrap=$("resultAnswer");wrap.innerHTML="";
 resultTranslations().forEach(row=>{
   const d=document.createElement("div");d.className="resultLine";
   d.innerHTML=`<div class="resultEn">${row.en}</div><div class="resultJp">${row.jp}</div>`;
   wrap.append(d);
 });
 showScreen("result");
}
function sequenceStep(){
 setDock("STEP 9｜型を再現","I think that → I have two reasons → First, they can → For example, they can → Second, they can → For example, they can → 結論","全文ではなく順番を思い出す",false);
 guide("答案の定型文を、正しい順番にタップしてください。");
 const target=[
   {id:"open",text:"I think that ～."},
   {id:"reasons",text:"I have two reasons."},
   {id:"first",text:"First, they can ～."},
   {id:"example1",text:"For example, they can ～."},
   {id:"second",text:"Second, they can ～."},
   {id:"example2",text:"For example, they can ～."},
   {id:"close",text:"For these reasons, I think so."}
 ];
 if(state.sequence.some(x=>typeof x==="string")){state.sequence=[];save()}
 const made=document.createElement("div");made.className="sequenceMade";
 const grid=document.createElement("div");grid.className="sequenceGrid";
 const pool=[target[4],target[1],target[3],target[2],target[6],target[0],target[5]];
 function redrawMade(){
   made.innerHTML="";
   state.sequence.forEach(id=>{const it=target.find(v=>v.id===id);if(!it)return;const s=document.createElement("span");s.className="token";s.textContent=it.text;made.append(s)});
 }
 redrawMade();
 pool.forEach(item=>{
   const b=document.createElement("button");b.className="seq";b.dataset.id=item.id;b.textContent=item.text;
   if(state.sequence.includes(item.id))b.style.visibility="hidden";
   b.onclick=()=>{
     const pos=state.sequence.length;
     if(!target[pos]||item.id!==target[pos].id){toast("順番が違うよ");return}
     state.sequence.push(item.id);save();b.style.visibility="hidden";redrawMade();
     if(state.sequence.length===target.length){
       state.history.push({id:q().id,time:Date.now(),words:words(allText())});state.streak++;save();
       setTimeout(showResult,220);
     }
   };
   grid.append(b);
 });
 $("controls").append(made,grid);
}
function resetCurrent(){state=Object.assign(defaultState(),{qIndex:state.qIndex,lang:state.lang,history:state.history,streak:state.streak});save();render()}
function nextQuestion(){state.qIndex=(state.qIndex+1)%QUESTIONS.length;state.step=1;state.lines=[];state.stage=null;state.selected1=null;state.selected2=null;state.step1Correct=false;state.fixedTapped=false;state.sequence=[];save();render()}

document.querySelectorAll(".langBtn").forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;save();render()});
$("helpBtn").onclick=()=>{if(lastGuide)guide(lastGuide)};
$("homeBtn").onclick=()=>{save();showScreen("home")};
$("startOpinion").onclick=()=>{showScreen("opinion");render()};
$("resumeOpinion").onclick=()=>{showScreen("opinion");render()};
$("resetBtn").onclick=()=>{state=defaultState();save();showScreen("opinion");render()};
$("startEmail").onclick=()=>showScreen("email");
$("emailHome").onclick=()=>showScreen("home");
$("printResult").onclick=()=>window.print();
$("nextResult").onclick=()=>{nextQuestion();showScreen("opinion");render()};
$("retryResult").onclick=()=>{resetCurrent();showScreen("opinion");render()};
$("resultHome").onclick=()=>showScreen("home");


render();
</script>
